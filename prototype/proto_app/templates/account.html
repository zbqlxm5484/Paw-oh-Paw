{% extends "base.html" %}
{% block title %}기본 정보 · Paw oh Paw{% endblock %}
{% block content %}
<main style="max-width:860px;margin:0 auto;padding:40px 40px 96px;display:flex;flex-direction:column;gap:24px">
  <a class="lk" href="/my" style="align-self:flex-start;display:flex;align-items:center;gap:4px;font-size:16px;font-weight:600;color:#5B6472"><svg width="18" height="18" viewBox="0 0 24 24"><use href="#w-back"></use></svg>마이페이지</a>
  <div style="display:flex;align-items:center;justify-content:space-between"><h1 style="margin:0;font-size:38px;font-weight:800;letter-spacing:-1px">기본 정보</h1><span data-toast="정보 수정은 준비 중이에요" style="height:48px;padding:0 22px;border-radius:12px;border:1px solid #E2DCD3;display:flex;align-items:center;font-size:16px;font-weight:600;cursor:pointer">수정</span></div>
  <div style="background:#fff;border:1px solid #ECE8E2;border-radius:22px;padding:8px 36px">
    {% for k, v in rows %}
    <div style="display:flex;align-items:center;justify-content:space-between;gap:16px;min-height:76px;border-top:{{ '1px solid #F2EFEA' if not loop.first else 'none' }}"><span style="font-size:17px;color:#5B6472">{{ k }}</span><span style="font-size:18px;font-weight:600;text-align:right">{{ v }}</span></div>
    {% endfor %}
  </div>
  <span data-toast="회원 탈퇴는 고객센터로 문의해 주세요" style="font-size:15px;color:#A0A7B2;cursor:pointer">회원 탈퇴</span>
</main>
{% endblock %}
