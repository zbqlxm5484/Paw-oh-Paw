{% extends "base.html" %}
{% block title %}기본 정보 · Paw oh Paw{% endblock %}
{% block content %}
<main style="max-width:860px;margin:0 auto;padding:40px 40px 96px;display:flex;flex-direction:column;gap:24px">
  <a class="lk" href="/my" style="align-self:flex-start;display:flex;align-items:center;gap:4px;font-size:16px;font-weight:600;color:#5B6472"><svg width="18" height="18" viewBox="0 0 24 24"><use href="#w-back"></use></svg>마이페이지</a>
  <div style="display:flex;align-items:center;justify-content:space-between"><h1 style="margin:0;font-size:38px;font-weight:800;letter-spacing:-1px">기본 정보</h1></div>
  <div style="background:#fff;border:1px solid #ECE8E2;border-radius:22px;padding:8px 36px">
    {% for k, v in rows %}
    <div style="display:flex;align-items:center;justify-content:space-between;gap:16px;min-height:76px;border-top:{{ '1px solid #F2EFEA' if not loop.first else 'none' }}"><span style="font-size:17px;color:#5B6472">{{ k }}</span><span style="font-size:18px;font-weight:600;text-align:right">{{ v }}</span></div>
    {% endfor %}
  </div>
  <form method="post" action="/account/profile" style="background:#fff;border:1px solid #ECE8E2;border-radius:22px;padding:28px 36px;display:flex;flex-direction:column;gap:16px">
    <b style="font-size:19px">내 정보</b>
    <label style="display:flex;flex-direction:column;gap:8px"><span style="font-size:15px;color:#5B6472">이름 (기록의 작성자로 남아요)</span><input name="name" value="{{ me.name }}" style="height:52px;border-radius:12px;border:1px solid #ECE8E2;background:#fff;padding:0 16px;font-size:16px;color:#1B2433;outline:none"></label>
    <label style="display:flex;flex-direction:column;gap:8px"><span style="font-size:15px;color:#5B6472">이메일 (비밀번호 재설정 링크를 받아요)</span><input type="email" name="email" value="{{ me.email }}" style="height:52px;border-radius:12px;border:1px solid #ECE8E2;background:#fff;padding:0 16px;font-size:16px;color:#1B2433;outline:none"></label>
    <button type="submit" style="align-self:flex-end;height:48px;padding:0 22px;border-radius:12px;border:0;background:#1B2433;color:#fff;font-size:16px;font-weight:700;cursor:pointer">저장</button>
  </form>
  <form method="post" action="/account/password" style="background:#fff;border:1px solid #ECE8E2;border-radius:22px;padding:28px 36px;display:flex;flex-direction:column;gap:16px">
    <b style="font-size:19px">비밀번호 변경</b>
    <input type="password" name="current_pw" autocomplete="current-password" placeholder="현재 비밀번호" style="height:52px;border-radius:12px;border:1px solid #ECE8E2;background:#fff;padding:0 16px;font-size:16px;color:#1B2433;outline:none">
    <input type="password" name="pw" autocomplete="new-password" placeholder="새 비밀번호 (8자 이상)" style="height:52px;border-radius:12px;border:1px solid #ECE8E2;background:#fff;padding:0 16px;font-size:16px;color:#1B2433;outline:none">
    <input type="password" name="pw2" autocomplete="new-password" placeholder="새 비밀번호 확인" style="height:52px;border-radius:12px;border:1px solid #ECE8E2;background:#fff;padding:0 16px;font-size:16px;color:#1B2433;outline:none">
    <button type="submit" style="align-self:flex-end;height:48px;padding:0 22px;border-radius:12px;border:0;background:#1B2433;color:#fff;font-size:16px;font-weight:700;cursor:pointer">바꾸기</button>
  </form>
  <span data-toast="회원 탈퇴는 고객센터로 문의해 주세요" style="font-size:15px;color:#A0A7B2;cursor:pointer">회원 탈퇴</span>
</main>
{% endblock %}
