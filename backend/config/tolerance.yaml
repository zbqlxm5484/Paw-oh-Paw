# 회차 비교 오차 범위(명세 5절 비교 규칙, 15.8 판정 표, 10절 Q4). 수치 코드(12.3)별 원 단위 값이다.
# |차이| ≤ 값이면 WITHIN_RANGE(범위 안), 넘으면 INCREASE·DECREASE(증가·감소). 여기 없는 수치는 UNKNOWN·RANGE_NOT_SET(변화 판단 기준 미확정).
# 읽는 곳: app/services/tolerance.py(16절 TOLERANCE_FILE). 판정: app/report/judge.py(보고서의 직전 회차 비교와 비교 API가 같이 쓴다).
# 모르는 수치 코드·음수·숫자가 아닌 값이 있으면 워커가 시작하지 않는다. 파일을 비우면 모든 변화 판정이 UNKNOWN이 된다.
#
# 임시값(박규원 통합본 9-3, 2026-11-02): 제니 한 마리를 같은 날 다시 쟀을 때(fs-v4+flip, 좌우 8+8회) 재측정 차의 90% 지점.
# 고관절·무릎은 박규원 MR 80 답변(11-03, 같은 날 8회 재측정의 중앙값 약 4.7°·8.0°)의 5°·8°다. 팔꿈치는 재측정 흔들림이 커서 뺐다.
# 11-05 여러 마리·여러 날 재측정 결과를 받으면 바꾼다. 입각기 비율은 "4~5%p" 중 큰 쪽 5.0을 둔다(그만큼 변화 판정이 보수적이다).
# 어깨·앞발목·뒷발목은 제니 한 마리 16회, 나머지는 5마리 8회 기준이라 근거가 섞여 있다. 11-05 재측정에서 같은 기준으로 다시 낸다(박규원 MR 86 리뷰).
# 값이 모두 통과 8개 평균 기준이라 회차 비교·좌우 차이 모두 n_passes 8 이상일 때만 쓴다(report/judge.py의 usable_tolerance).
# 시연에서 미확정이 너무 많으면 통과 수를 낮추지 말고, 그 통과 수에 맞는 범위와 함께 바꾼다(5회면 고관절 6.5·무릎 12·입각기 7).
# 기업 값(10절 Q4)을 받으면 그 값으로 바꾼다.
rom_shoulder: 2.5 # deg, 어깨 가동 범위
rom_carpus: 7.6 # deg, 앞발목 가동 범위
rom_hip: 5.0 # deg, 고관절 가동 범위
rom_stifle: 8.0 # deg, 무릎 가동 범위
rom_tarsus: 4.0 # deg, 뒷발목 가동 범위
stance_ratio: 5.0 # pct, 입각기 비율(%p)
