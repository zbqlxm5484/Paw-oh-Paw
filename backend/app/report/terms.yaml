# 보고서 검사 목록(명세 8절 만드는 순서 7, PR-F08-11·12, KPI-30·31). app/report/checks.py가 읽는다.
# 폴더 이름을 data로 두면 .gitignore(회사 데이터 규칙)에 걸리므로 패키지 바로 아래에 둔다.
#
# 임시 초안(2026-11-02, 조영운): 김지윤(QA)의 금지 표현 목록·문장 템플릿 파일을 받으면 이 파일을 그 내용으로 바꾼다.
# 보고서 모듈은 팀 서비스와 떨어진 패키지라(11.3) 목록도 패키지 안에 둔다. 환경 변수로 바꾸지 않는다.
#
# forbidden: 어느 판본에도 실리면 안 되는 표현. term은 사람이 읽는 이름, pattern(선택)은 정규식(대소문자 무시).
#            pattern이 없으면 term 그대로 찾는다.
# jargon:    보호자용(OWNER)에 나오면 같은 문서 안에 explanation 문구가 한 번은 있어야 하는 전문 용어.
#            수의사용(VET)은 검사하지 않는다.
version: "0.1-draft"

forbidden:
  - term: 확진
    reason: 진단을 단정한다. 보고서는 보행 평가 보조 자료이고 진단을 대신하지 않는다
  - term: 진단합니다
    pattern: 진단(합니다|됩니다|입니다|된다|한다|함)
    reason: 진단 행위로 읽힌다. "진단을 대신하지 않습니다" 같은 부정문은 걸리지 않는다
  - term: 치료가 필요
    pattern: (치료|수술|약물|투약)(이|가)?\s?(필요|권장|요망|시급)
    reason: 치료 지시는 수의사의 판단이다
  - term: 완치
    reason: 치료 결과를 단정한다
  - term: 질병명 단정
    pattern: (관절염|고관절\s?이형성|슬개골\s?탈구|십자인대\s?파열|디스크)(입니다|이다|으로\s?보입니다|로\s?보입니다|로\s?판단)
    reason: 병명을 단정한다. 수치와 차이만 적는다
  - term: 정상입니다
    pattern: (정상|이상\s?없음|문제\s?없음)(입니다|이다|으로\s?확인)
    reason: 정상 여부를 단정한다. 참고 범위와의 비교만 적는다
  - term: 반드시
    reason: 단정·강제 표현
  - term: 보장
    pattern: 보장(합니다|한다|됩니다)
    reason: 결과를 보장할 수 없다
  - term: 100%
    pattern: 100\s?%
    reason: 단정 표현

jargon:
  - term: 입각기
    explanation: 발이 바닥에 닿아 있는 구간
  - term: 유각기
    explanation: 발이 공중에 떠 있는 구간
  - term: 가동 범위
    explanation: 관절이 움직인 각도의 폭
  - term: 대칭 지수
    explanation: 왼쪽과 오른쪽의 차이를 백분율로 나타낸 값
  - term: 보행 주기
    explanation: 한 발이 바닥에 닿고 다시 닿을 때까지
  - term: 속보
    explanation: 대각선의 두 다리를 함께 내딛는 빠른 걸음
  - term: 평보
    explanation: 네 발을 차례로 내딛는 느린 걸음
  - term: 걸음 길이
    explanation: 같은 발이 두 번 닿은 자리 사이의 거리
