# 보고서 검사 목록 — 김지윤 초안 (2026-11-03). MR 78의 backend/app/report/terms.yaml 자리에 넣는다.
#
# 근거: 세부명세서 PG-05(진단성 표현 금지), PR-F08-03(근거 없는 변화 단정 금지), PR-F08-11·12, KPI-30·31,
#       백엔드 명세 5절("좋아짐·나빠짐 같은 평가 단어는 백엔드가 내지 않는다. 방향(증가·감소)만 낸다"),
#       BE-21("표현은 '차이가 가장 큰 다리'까지만 한다. 진단은 하지 않는다"), screenPlan 5절 금지 표현("아프다", "좋아졌다").
#
# forbidden: 어느 판본(보호자용·수의사용)에도 실리면 안 되는 표현. 대소문자 무시. pattern이 없으면 term 그대로 찾는다.
#            보고서가 써도 되는 말: 증가·감소·범위 안·비교 불가, 차이가 가장 큰 다리, 참고 범위와의 비교, 수의사와 상담.
# jargon:    보호자용에 나오면 같은 문서 안에 explanation 문구가 한 번은(토씨까지 그대로) 있어야 하는 전문 용어.
#            explanation은 보고서 끝 "용어 설명" 칸에 그대로 싣는다. 용어 바로 뒤 괄호로 써도 된다.
#            수의사용은 검사하지 않는다.
version: "0.2-draft"

forbidden:
  # ---- 1. 진단 (PG-05) ----
  - term: 확진
    reason: 진단을 단정한다. 보고서는 보행 평가 보조 자료이고 진단을 대신하지 않는다
  - term: 진단합니다
    pattern: 진단(합니다|됩니다|입니다|된다|한다|함|받|이\s?필요|을\s?권)
    reason: 진단 행위로 읽힌다. "진단을 대신하지 않습니다"·"진단이 아닌" 같은 부정문은 걸리지 않는다
  - term: 질병명 단정
    pattern: (관절염|고관절\s?이형성|슬개골\s?탈구|십자인대\s?파열|디스크|골절|탈구|염증|관절\s?질환|신경\s?질환)[^.!?\n]{0,8}?(입니다|이다|이에요|예요|보입니다|판단|의심|추정|가능성|소견|징후|여부)
    reason: 병명을 단정하거나 의심·추정한다. 수치와 좌우 차이만 적는다
  - term: 의심·추정
    pattern: (의심|추정)(됩니다|된다|됨|되는|스럽|이\s?됩니다|이\s?갑니다|해\s?볼)
    reason: 병명 없이도 진단성 표현이다
  - term: 소견
    reason: 수의사의 진단 용어다. 보고서는 "결과"·"수치"로 쓴다
  - term: 원인 단정
    pattern: (원인|때문)(입니다|이다|이에요|으로\s?보입니다|로\s?보입니다|으로\s?추정|로\s?추정)
    reason: 차이의 원인을 단정한다. 원인 판단은 수의사의 몫이다
  - term: 아프다
    pattern: 아프|아픈|아파|통증|절뚝|절고\s?있|다리를\s?저|파행
    reason: 통증·파행은 진단성 단어다(screenPlan 금지 표현). "차이가 가장 큰 다리"까지만 적는다
  - term: 불편한 다리
    pattern: 불편(한|해\s?하는)\s?(다리|쪽|발)
    reason: BE-21은 "차이가 가장 큰 다리"까지만 허용한다
  - term: 문제·이상 단정
    pattern: (문제|이상|질환|질병)(가|이)\s?(있|의심|발견|확인)
    reason: 이상 유무를 단정한다
  - term: 건강 단정
    pattern: 건강(합니다|한\s?상태|에\s?이상|하다|해요)
    reason: 건강 여부를 단정한다
  - term: 정상입니다
    pattern: (정상|이상\s?없음|문제\s?없음|비정상)(입니다|이다|이에요|예요|으로\s?확인|으로\s?보입니다|로\s?보입니다)|비정상
    reason: 정상 여부를 단정한다. 참고 범위와의 비교만 적는다
  - term: 위험 단정
    pattern: (위험|위급|응급|심각)(합니다|한\s?상태|상황|해요|하다)
    reason: 상태의 경중을 단정한다

  # ---- 2. 치료 지시 (PG-05) ----
  - term: 치료가 필요
    pattern: (치료|수술|약물|투약|처방|진통제|보조제|물리\s?치료|재활\s?치료)(이|가|을|를)?\s?(필요|권장|요망|시급|추천|받으|받아야|하세요|하셔야|해야)
    reason: 치료 지시는 수의사의 판단이다. "수의사와 상담"은 써도 된다
  - term: 완치
    reason: 치료 결과를 단정한다

  # ---- 3. 변화 단정 (PR-F08-03, 백엔드 명세 5절) ----
  - term: 좋아짐·나빠짐
    pattern: (좋아|나아|호전|개선|악화|나빠|퇴행|회복|정상화)(졌|됐|되었|했|하고\s?있|되고\s?있|된\s?것|되는\s?중|됨|됩니다)
    reason: 평가 단어다. 백엔드는 증가·감소·범위 안만 낸다. 해석은 수의사에게 남긴다
  - term: 효과 단정
    pattern: (효과|차도)(가|는)?\s?(있|없|보입|나타)
    reason: 재활 효과를 단정한다. 수치 변화만 적는다

  # ---- 4. 단정·과장 표현 ----
  - term: 반드시
    pattern: 반드시(?!\s?(수의사|전문가|담당자))
    reason: 단정·강제 표현. "반드시 수의사와 상담"처럼 상담을 권하는 안내 문구는 허용한다
  - term: 보장
    pattern: 보장(합니다|한다|됩니다|해요|할\s?수)
    reason: 결과를 보장할 수 없다
  - term: 100%
    pattern: 100\s?%
    reason: 단정 표현
  - term: 확실·틀림없이
    pattern: 틀림없|확실(히|합니다|하다|해요)|분명(히|합니다|하다)|단언
    reason: 단정 표현. 측정값은 오차가 있다

jargon:
  # ---- 보행 ----
  - term: 입각기
    explanation: 한 걸음 중 발이 바닥을 딛고 있는 구간
  - term: 유각기
    explanation: 한 걸음 중 발이 공중에 떠 있는 구간
  - term: 보행 주기
    explanation: 한 발이 바닥에 닿은 뒤 다시 닿을 때까지의 한 걸음
  - term: 유효 통과
    explanation: 수치 계산에 쓸 수 있는, 매트를 옆으로 곧게 지나간 걷기 한 번
  - term: 속보
    explanation: 대각선 방향의 앞발과 뒷발이 함께 바닥을 딛는 빠른 걸음
  - term: 평보
    explanation: 네 발이 차례로 바닥을 딛는 느린 걸음
  - term: 측대보
    explanation: 같은 쪽 앞발과 뒷발이 함께 움직이는 걸음

  # ---- 수치 ----
  - term: 가동 범위
    explanation: 걸을 때 관절을 접었다 펴는 각도의 폭
  - term: ROM
    explanation: 관절 가동 범위
  - term: 대칭 지수
    explanation: 왼쪽과 오른쪽 값의 차이를 두 값의 평균으로 나눈 백분율
  - term: 걸음 길이
    explanation: 한 걸음에 나아가는 거리(몸통 길이 대비 %)
  - term: 발 들림 높이
    explanation: 걸을 때 발이 바닥에서 가장 높이 들린 높이(몸통 길이 대비 %)
  - term: 발 움직임 범위
    explanation: 걸을 때 발이 앞뒤로 움직인 폭(몸통 길이 대비 %)
  - term: 중앙값
    explanation: 값을 크기순으로 늘어놓았을 때 가운데에 오는 값
  - term: 변동계수
    explanation: 걸음마다 값이 얼마나 흔들리는지 평균 대비 백분율로 나타낸 값
  - term: 백분위
    explanation: 값을 작은 순서로 늘어놓았을 때의 위치(100등분)
  - term: 참고 범위
    explanation: 공개 자료의 건강한 반려견에게서 흔히 보이는 값의 폭. 진단 기준이 아니다
  - term: 오차 범위
    explanation: 같은 상태를 다시 재도 생길 수 있는 값의 차이
  - term: 기준 회차
    explanation: 재활 시작 무렵에 잰 회차. 이후 변화를 견주는 기준

  # ---- 몸 부위 ----
  - term: 고관절
    explanation: 뒷다리가 몸통과 이어지는 엉덩이 관절
  - term: 앞발목
    explanation: 앞다리의 발목 관절(사람의 손목에 해당)
  - term: 뒷발목
    explanation: 뒷다리의 발목 관절(사람의 발목에 해당)
  - term: 관절점
    explanation: 영상에서 찾은 관절의 위치 점
