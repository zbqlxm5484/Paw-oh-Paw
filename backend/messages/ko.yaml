# --- 11.6 메일: 비밀번호 재설정 ({name} 담당자 이름, {link} 재설정 링크, {ttl_min} 유효 시간) ---
mail.password_reset.subject: "[크림오프] 비밀번호 재설정 안내"
mail.password_reset.body: |
  {name}님, 안녕하세요.

  아래 링크를 열어 새 비밀번호를 정해 주세요. 링크는 {ttl_min}분 동안만 쓸 수 있습니다.

  {link}

  본인이 요청하지 않았다면 이 메일을 무시해 주세요. 비밀번호는 바뀌지 않습니다.
