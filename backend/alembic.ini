# Alembic config (spec 11.7: tables change only through migration files).
# ASCII only: Alembic reads this file with the OS locale encoding (cp949 on Korean
# Windows), so any non-ASCII character here breaks "alembic ..." and pytest.
# Korean explanation and the command list: README.md, "Alembic" part of the
# table-creation section. The DB URL is not here: alembic/env.py reads
# DATABASE_URL from .env.
#
#   alembic upgrade head        # create / upgrade tables to the latest revision
#   alembic downgrade -1        # step back one revision
#   alembic revision -m "msg"   # new migration file (fill upgrade()/downgrade() by hand)
#   alembic check               # report model vs DB drift

[alembic]
script_location = %(here)s/alembic
prepend_sys_path = .
file_template = %%(rev)s_%%(slug)s
path_separator = os

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
