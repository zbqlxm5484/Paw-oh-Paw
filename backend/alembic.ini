# Alembic 설정 (명세 11.7: 테이블 변경은 마이그레이션 파일로만 한다)
# DB 주소는 여기에 적지 않는다. alembic/env.py가 .env의 DATABASE_URL을 읽는다.
#
#   alembic upgrade head        # 최신 상태로 테이블 만들기·바꾸기
#   alembic downgrade -1        # 한 단계 되돌리기
#   alembic revision -m "설명"  # 새 마이그레이션 파일 만들기(직접 채운다)
#   alembic check               # 모델과 DB가 다르면 알려 준다

[alembic]
script_location = %(here)s/alembic
prepend_sys_path = .
file_template = %%(rev)s_%%(slug)s
path_separator = os

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
