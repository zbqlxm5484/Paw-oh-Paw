#         curl -fsS http://127.0.0.1:18080/api/v1/health && exit 0
#         sleep 2
#       done
#       echo "health check failed"; $COMPOSE logs --tail=50; exit 1
#   after_script:
#     - docker compose -p $SMOKE_PROJECT -f compose.yaml -f infra/ci/compose.ci.yaml down -v --remove-orphans

# ---------- deploy ----------
deploy:
  stage: deploy
  rules:
    - if: $CI_COMMIT_BRANCH == "develop"
    - if: $CI_COMMIT_BRANCH == "master"
      when: manual
  script:
    - cp "$ENV_FILE" .env
    - docker compose -p creamoff up -d --build --remove-orphans
    - docker image prune -f
    - |
      for i in $(seq 1 30); do
        curl -fsS http://127.0.0.1:8080/api/v1/health && exit 0
        sleep 2
      done
      echo "deploy health check failed"; docker compose -p creamoff logs --tail=50; exit 1
