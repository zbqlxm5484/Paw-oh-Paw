# CI/CD: check → build → smoke → deploy (manual/gitlab-ci-guide.md 4-1)
# 러너: EC2 shell executor, 태그 docker. image:/services: 는 무시되므로 도구는 docker run 으로 실행
stages: [check, build, smoke, deploy]

# MR 파이프라인 우선. MR 열린 브랜치는 브랜치 파이프라인 중복 생성 안 함
workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_OPEN_MERGE_REQUESTS
      when: never
    - if: $CI_COMMIT_TAG =~ /^v/      # 배포 태그(v*) 파이프라인. GPU 서버 배포용(deploy_gpu)
    - if: $CI_COMMIT_BRANCH

default:
  tags: [docker]            # 러너 태그. 없으면 pending

variables:
  PY_IMAGE: python:3.11-slim         # 명세서 PR-C-07
  SMOKE_PROJECT: ci-$CI_PIPELINE_ID

# 도구 컨테이너 공통. $(id -u)는 variables:에 못 넣으므로(재해석 안 됨) before_script에서 정의
.tool:
  stage: check
  before_script:
    - export RUN="docker run --rm --user $(id -u):$(id -g) -e HOME=/tmp -v $CI_PROJECT_DIR:/src -w /src"

# ---------- check ----------
reproduce:                  # 기업 검수 절차(새 venv → 설치 → 실행) 재현
  extends: .tool
  script:
    - $RUN $PY_IMAGE sh infra/ci/reproduce.sh      # 서비스마다 새 venv(루트·backend·analysis_api·prototype)

ruff:
  extends: .tool
  script:
    - $RUN ghcr.io/astral-sh/ruff:0.6.9 check .

hadolint:
  stage: check
  script:
    - docker run --rm -i hadolint/hadolint:v2.12.0 hadolint --failure-threshold error - < backend/Dockerfile
    - docker run --rm -i hadolint/hadolint:v2.12.0 hadolint --failure-threshold error - < frontend/Dockerfile
    - docker run --rm -i hadolint/hadolint:v2.12.0 hadolint --failure-threshold error - < infra/docker/web.Dockerfile

gitleaks:
  stage: check
  script:
    - docker run --rm -v "$CI_PROJECT_DIR":/src zricethezav/gitleaks:v8.21.2 detect --source /src --no-git --redact

compose-config:
  stage: check
  script:
    - cp .env.example .env
    - docker compose --profile bluegreen config -q

pip-audit:
  extends: .tool
  allow_failure: true
  rules:
    - exists: [backend/requirements.txt]
  script:
    - >
      $RUN $PY_IMAGE sh -ec '
      python -m venv /tmp/venv && . /tmp/venv/bin/activate &&
      pip install -q pip-audit && pip-audit -r backend/requirements.txt'

# ---------- build ----------
build:
  stage: build
  script:
    - cp .env.example .env
    # api/web 은 profiles(bluegreen) 서비스라 프로필을 켜야 빌드 대상에 포함된다
    - docker compose --profile bluegreen build

# ---------- smoke ----------
# 배포 스크립트를 두 번 실행해 첫 배포(blue)와 blue→green 전환까지 테스트한다
smoke:
  stage: smoke
  variables:
    COMPOSE_PROJECT: $SMOKE_PROJECT
    COMPOSE_EXTRA: "-f infra/ci/compose.ci.yaml"
  script:
    # 러너가 job 을 동시에 여러 개 돌려도 smoke 끼리 호스트 포트가 겹치지 않게, 슬롯 번호(CI_CONCURRENT_ID)만큼 더한 포트를 쓴다
    - export SMOKE_PORT=$((18080 + CI_CONCURRENT_ID))
    - export PUBLIC_URL=http://127.0.0.1:$SMOKE_PORT
    - cp .env.example .env
    # JWT_SECRET·FILE_URL_SECRET은 32자 이상이고 서로 달라야 한다(backend/app/core/config.py). 실행할 때마다 새로 만들어 저장소에 값을 두지 않는다
    - echo "JWT_SECRET=$(openssl rand -hex 32)" >> .env
    - echo "FILE_URL_SECRET=$(openssl rand -hex 32)" >> .env
    - bash infra/ci/deploy.sh      # 1회차: 첫 배포(blue)
    - bash infra/ci/deploy.sh      # 2회차: blue→green 전환
  after_script:
    # profiles 서비스(api/web-blue/green)는 COMPOSE_PROFILES 없이 down 하면 안 지워진다
    - COMPOSE_PROFILES=bluegreen docker compose -p $SMOKE_PROJECT -f compose.yaml -f infra/ci/compose.ci.yaml down -v --remove-orphans

# ---------- deploy ----------
# 무중단(blue-green) 배포 + 실패 시 자동 원복. 동작은 infra/ci/deploy.sh 참고
# 환경 2벌: master=운영(compose 프로젝트 creamoff, 포트 8080, 변수 ENV_FILE, 수동 배포),
#           develop=개발(compose 프로젝트 creamoff-dev, 포트 8081, 변수 ENV_FILE_DEV, 자동 배포).
# 프로젝트명이 달라 DB·Redis·업로드 볼륨이 서로 분리된다. 같은 EC2 한 대에서 둘이 동시에 돈다
deploy_prod:
  stage: deploy
  resource_group: creamoff-server     # 운영 배포 동시 실행 방지
  rules:
    - if: $CI_COMMIT_BRANCH == "master"
      when: manual
  script:
    - cp "$ENV_FILE" .env
    - bash infra/ci/deploy.sh

deploy_dev:
  stage: deploy
  resource_group: creamoff-dev-server # 개발 배포 동시 실행 방지(운영과 별도 그룹)
  variables:
    COMPOSE_PROJECT: creamoff-dev
    NGINX_PORT: "8081"                # compose.yaml 의 nginx 호스트 포트
    PUBLIC_URL: http://127.0.0.1:8081
  rules:
    - if: $CI_COMMIT_BRANCH == "develop"
  script:
    # 더 새로운 커밋이 이미 develop 에 있으면 배포하지 않는다(순서 역전으로 DB 마이그레이션 번호가 어긋나는 것 방지)
    - if bash infra/ci/is_stale.sh; then exit 0; fi
    - cp "$ENV_FILE_DEV" .env
    - bash infra/ci/deploy.sh

# GPU 서버 분석 API 배포 (Jira 239). 두 경우에 실행된다.
#  1) 보호된 태그 v*: 배포. 릴리스 폴더명은 태그명
#  2) master 머지: 분석 API 관련 파일이 바뀐 때만 자동 배포. 릴리스 폴더명은 master-<커밋 SHA 8자>
#     (GPU 서버는 한 대라 운영 서비스가 쓴다. develop 머지로는 배포하지 않는다. 개발 환경 백엔드는 ANALYSIS_API_MODE=mock 을 쓴다)
#     동결: CI/CD 변수 GPU_DEPLOY_FREEZE=1 이면 태그·master 배포 모두 건너뛴다(태그를 미리 붙여도 동결 중엔 배포되지 않음).
#           긴급 배포가 필요하면 변수를 끄거나(0·삭제) 가이드 11절 수동 배포를 쓴다
# 러너: GPU 서버(jupyter12) shell executor, 태그 gpu-deploy, Protected. 위의 check·build·smoke 가 통과해야 도달한다.
# 동작은 infra/ci/deploy_gpu.sh 참고. 수동 배포 절차는 manual/GPU서버_분석API_배포_가이드.md
deploy_gpu:
  stage: deploy
  tags: [gpu-deploy]
  resource_group: gpu-analysis-api    # GPU 서버 배포 동시 실행 방지
  timeout: 20m
  rules:
    - if: $CI_COMMIT_TAG =~ /^v/ && $GPU_DEPLOY_FREEZE != "1"
    - if: $CI_COMMIT_BRANCH == "master" && $GPU_DEPLOY_FREEZE != "1"
      changes:                        # pipeline.py 가 루트 engine 을 불러오므로 engine 도 포함
        - analysis_api/**/*
        - engine/**/*
        - infra/ci/deploy_gpu.sh
  script:
    - bash infra/ci/deploy_gpu.sh "${CI_COMMIT_TAG:-master}"    # 태그 없으면(master) 스크립트가 master-<SHA 8자>로 바꾼다
