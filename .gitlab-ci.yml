# CI/CD: check → build → smoke → deploy (manual/gitlab-ci-guide.md 4-1)
# 러너: EC2 shell executor, 태그 docker. image:/services: 는 무시되므로 도구는 docker run 으로 실행
stages: [check, build, smoke, deploy]

# MR 파이프라인 우선. MR 열린 브랜치는 브랜치 파이프라인 중복 생성 안 함
workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_OPEN_MERGE_REQUESTS
      when: never
    - if: $CI_COMMIT_BRANCH

default:
  tags: [docker]            # 러너 태그. 없으면 pending

variables:
  PY_IMAGE: python:3.11-slim         # 명세서 PR-C-07
  SMOKE_PROJECT: ci-$CI_PIPELINE_ID

# 도구 컨테이너 공통. $(id -u)는 variables:에 못 넣으므로(재해석 안 됨) before_script에서 정의
.tool:
  stage: check
  before_script:
    - export RUN="docker run --rm --user $(id -u):$(id -g) -e HOME=/tmp -v $CI_PROJECT_DIR:/src -w /src"

# ---------- check ----------
reproduce:                  # 기업 검수 절차(새 venv → 설치 → 실행) 재현
  extends: .tool
  script:
    - $RUN $PY_IMAGE sh infra/ci/reproduce.sh      # 서비스마다 새 venv(루트·backend·analysis_api·prototype)

ruff:
  extends: .tool
  script:
    - $RUN ghcr.io/astral-sh/ruff:0.6.9 check .

hadolint:
  stage: check
  script:
    - docker run --rm -i hadolint/hadolint:v2.12.0 hadolint --failure-threshold error - < backend/Dockerfile
    - docker run --rm -i hadolint/hadolint:v2.12.0 hadolint --failure-threshold error - < frontend/Dockerfile

gitleaks:
  stage: check
  script:
    - docker run --rm -v "$CI_PROJECT_DIR":/src zricethezav/gitleaks:v8.21.2 detect --source /src --no-git --redact

compose-config:
  stage: check
  script:
    - cp .env.example .env
    - docker compose --profile bluegreen config -q

pip-audit:
  extends: .tool
  allow_failure: true
  rules:
    - exists: [backend/requirements.txt]
  script:
    - >
      $RUN $PY_IMAGE sh -ec '
      python -m venv /tmp/venv && . /tmp/venv/bin/activate &&
      pip install -q pip-audit && pip-audit -r backend/requirements.txt'

# ---------- build ----------
build:
  stage: build
  script:
    - cp .env.example .env
    # api/web 은 profiles(bluegreen) 서비스라 프로필을 켜야 빌드 대상에 포함된다
    - docker compose --profile bluegreen build

# ---------- smoke ----------
# 배포 스크립트를 두 번 실행해 첫 배포(blue)와 blue→green 전환까지 테스트한다
smoke:
  stage: smoke
  variables:
    COMPOSE_PROJECT: $SMOKE_PROJECT
    COMPOSE_EXTRA: "-f infra/ci/compose.ci.yaml"
    PUBLIC_URL: http://127.0.0.1:18080
  script:
    - cp .env.example .env
    # JWT_SECRET·FILE_URL_SECRET은 32자 이상이고 서로 달라야 한다(backend/app/core/config.py). 실행할 때마다 새로 만들어 저장소에 값을 두지 않는다
    - echo "JWT_SECRET=$(openssl rand -hex 32)" >> .env
    - echo "FILE_URL_SECRET=$(openssl rand -hex 32)" >> .env
    - bash infra/ci/deploy.sh      # 1회차: 첫 배포(blue)
    - bash infra/ci/deploy.sh      # 2회차: blue→green 전환
  after_script:
    # profiles 서비스(api/web-blue/green)는 COMPOSE_PROFILES 없이 down 하면 안 지워진다
    - COMPOSE_PROFILES=bluegreen docker compose -p $SMOKE_PROJECT -f compose.yaml -f infra/ci/compose.ci.yaml down -v --remove-orphans

# ---------- deploy ----------
# 무중단(blue-green) 배포 + 실패 시 자동 원복. 동작은 infra/ci/deploy.sh 참고
deploy:
  stage: deploy
  resource_group: creamoff-server     # 배포 동시 실행 방지
  rules:
    - if: $CI_COMMIT_BRANCH == "develop"
    - if: $CI_COMMIT_BRANCH == "master"
      when: manual
  script:
    - cp "$ENV_FILE" .env
    - bash infra/ci/deploy.sh
