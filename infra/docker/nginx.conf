# 현재 서비스 중인 색(api-blue/green, web-blue/green). deploy.sh 가 쓰고 `nginx -s reload` 로 전환한다
include /etc/nginx/upstream/active.conf;

server {
    listen 80;
    server_name _;
    server_tokens off;

    # 영상 업로드 한도. 백엔드 UPLOAD_MAX_MB와 맞춘다
    client_max_body_size 100m;

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # 보고서 생성·업로드 검사 시간. 백엔드 처리 시간 보고 조정
    proxy_read_timeout 120s;

    # FastAPI. /api/v1/health 포함, /api/ 전부 백엔드로 (apiRoutingConvention)
    # /metrics는 접두어 없이 루트라 여기 안 걸리고 화면으로 간다. 수집기는 내부망 api:8000/metrics 직접
    location /api/ {
        proxy_pass http://api_backend;
        # 업로드를 디스크에 버퍼링하지 않고 바로 넘김
        proxy_request_buffering off;
    }

    # React 화면
    location / {
        proxy_pass http://web_backend;
    }
}
