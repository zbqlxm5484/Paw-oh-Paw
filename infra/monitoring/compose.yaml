# 모니터링(Prometheus·Grafana·node_exporter). 팀 운영 도구이며 납품하지 않는다.
# 앱 compose(프로젝트 creamoff)와 따로 띄운다. deploy.sh 의 `--remove-orphans` 가 이 컨테이너를 지우지 않게 프로젝트 이름을 나눈다.
#
# 띄우기(EC2, 레포 루트에서):
#   cp infra/monitoring/.env.example infra/monitoring/.env   # 값을 채운다. 레포에 올리지 않는다
#   docker compose -p monitoring -f infra/monitoring/compose.yaml --env-file infra/monitoring/.env up -d
# 접근: 포트는 EC2 로컬(127.0.0.1)에만 열린다. 내 PC에서 SSH 터널로 본다.
#   ssh -L 3000:127.0.0.1:3000 -L 9090:127.0.0.1:9090 <EC2>   →   http://localhost:3000 (Grafana), http://localhost:9090 (Prometheus)
# 앱 컨테이너를 읽으려고 앱 네트워크 두 개에 붙는다: 운영(프로젝트 creamoff → creamoff_default), 개발(프로젝트 creamoff-dev → creamoff-dev_default).
# external 네트워크라 두 환경을 각각 한 번 배포해 네트워크가 있어야 띄워진다(.gitlab-ci.yml deploy·deploy_dev).

services:
  prometheus:
    image: prom/prometheus:v3.5.0
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      # 보존 기간 기본 15일. 디스크 상한은 EC2 여유 디스크(309GB 중 16GB 사용, 11-06)를 보고 잡은 잠정값이다
      - --storage.tsdb.retention.time=15d
      - --storage.tsdb.retention.size=20GB
    ports:
      - "127.0.0.1:9090:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./prometheus/rules.yml:/etc/prometheus/rules.yml:ro
      - prometheus-data:/prometheus
    # GPU 서버 exporter 는 역방향 SSH 터널로 EC2 호스트 172.18.0.1 에 열린다(api 의 분석 API 터널과 같은 방식)
    extra_hosts:
      - "host.docker.internal:172.18.0.1"
    networks: [default, app_prod, app_dev]

  grafana:
    image: grafana/grafana:12.1.0
    restart: unless-stopped
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      # 첫 기동 때 관리자 계정을 정한다(기본 admin/admin 을 쓰지 않는다). 값은 .env 에만 둔다
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:?infra/monitoring/.env 에 GRAFANA_ADMIN_USER 를 넣는다}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?infra/monitoring/.env 에 GRAFANA_ADMIN_PASSWORD 를 넣는다}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana-data:/var/lib/grafana
    depends_on: [prometheus]

  # 서버(EC2 호스트) CPU·메모리·디스크. 호스트 파일시스템을 읽기 전용으로 보고(path.rootfs) 호스트 프로세스 공간(pid: host)을 쓴다.
  # network_mode: host 를 쓰지 않아 호스트에 포트가 열리지 않는다. 대신 네트워크 인터페이스 지표는 컨테이너 기준이다(CPU·메모리·디스크는 호스트 기준).
  node-exporter:
    image: prom/node-exporter:v1.9.1
    restart: unless-stopped
    pid: host
    command:
      - --path.rootfs=/host
    volumes:
      - /:/host:ro,rslave

networks:
  app_prod:
    name: creamoff_default
    external: true
  app_dev:
    name: creamoff-dev_default
    external: true

volumes:
  prometheus-data:
  grafana-data:
